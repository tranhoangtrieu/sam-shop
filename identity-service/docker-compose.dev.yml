# Quick local dev: embedded DB, no Postgres required.
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: sam-shop/identity-service:26.6.2-dev
    container_name: sam-identity-service-dev
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    ports:
      - "${KC_HTTP_PORT:-8080}:8080"
    command: start-dev
