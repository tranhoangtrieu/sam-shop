spring:
  application:
    name: user-service

server:
  port: ${SERVER_PORT:8086}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/sam-shop}

app:
  keycloak:
    url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:sam-shop}
    admin-username: ${KC_ADMIN_USERNAME:admin}
    admin-password: ${KC_ADMIN_PASSWORD:admin}
